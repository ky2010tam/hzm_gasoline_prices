<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>港澳珠油價實時格價</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- 頂部標題列 -->
    <header class="bg-blue-600 text-white shadow-md py-6 px-4 text-center">
        <h1 class="text-2xl font-bold">⛽ 港澳珠油價格價通</h1>
        <p class="text-blue-100 text-sm mt-1">實時追蹤香港、澳門及珠海最新油價</p>
    </header>

    <!-- 主要內容區 -->
    <main class="container mx-auto px-4 py-8 max-w-md flex-grow">
        <!-- 更新時間提示 -->
        <div class="text-right text-xs text-slate-400 mb-4" id="update-time">
            更新時間：載入中...
        </div>

        <!-- 油價卡片列表 -->
        <div id="price-cards" class="space-y-4">
            <!-- 載入中狀態 -->
            <div class="bg-white p-6 rounded-2xl shadow-sm text-center text-slate-400">
                正在從 GitHub 獲取最新油價數據...
            </div>
        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-200">
        Powered by GitHub Pages & Actions
    </footer>

    <!-- 前端 JavaScript 邏輯 -->
    <script>
        async function loadPrices() {
            try {
                // 讀取同倉庫下的 prices.json (加上時間戳防止快取)
                const response = await fetch('./prices.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('無法讀取油價數據');
                
                const data = await response.json();
                
                // 更新時間
                document.getElementById('update-time').innerText = `最後更新：${data.last_updated}`;
                
                // 渲染卡片
                const container = document.getElementById('price-cards');
                container.innerHTML = '';
                
                data.items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between transition hover:shadow-md";
                    
                    card.innerHTML = `
                        <div class="flex items-center space-x-4">
                            <span class="text-3xl">${item.flag}</span>
                            <div>
                                <h3 class="font-bold text-lg text-slate-700">${item.region} <span class="text-xs font-normal text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full ml-1">${item.type}</span></h3>
                                <p class="text-xs text-slate-400 mt-0.5">${item.note}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-2xl font-extrabold text-blue-600">${item.price.toFixed(2)}</span>
                            <span class="text-xs font-bold text-slate-500 block">${item.currency}</span>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                document.getElementById('price-cards').innerHTML = `
                    <div class="bg-red-50 text-red-600 p-4 rounded-xl text-center text-sm">
                        暫時無法載入油價資料，請稍後再試。
                    </div>
                `;
            }
        }

        // 網頁載入時執行
        loadPrices();
    </script>
</body>
</html>
